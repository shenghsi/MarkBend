[package]
name = "markbend-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
fs2 = "0.4"
percent-encoding = "2"
png = "0.18.1"
roxmltree = "0.21.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
