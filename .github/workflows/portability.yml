name: portability

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_packages:
        description: Build unsigned native test packages
        type: boolean
        default: false

permissions:
  contents: read

env:
  BEND_NO_TELEMETRY: '1'

jobs:
  bend:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check complete rendering batch
        run: |
          sh tests/check.sh

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: bend PROOF.bend
      - run: npm test
      - run: npm run build
      - run: node src/web/ci-assets.mjs record
        env:
          CI_CHECKOUT_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: |
            dist
            frontend-manifest.json
          if-no-files-found: error
          retention-days: 7

  desktop:
    needs: frontend
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            binary: markbend-desktop
            bundle: app
          - os: ubuntu-latest
            binary: markbend-desktop
            bundle: deb
          - os: windows-latest
            binary: markbend-desktop.exe
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux WebView tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: .
      - run: node src/web/ci-assets.mjs verify
        env:
          CI_CHECKOUT_SHA: ${{ github.sha }}
      - run: cargo test --manifest-path src/desktop/Cargo.toml --locked
      - name: Build debug executable
        if: ${{ !inputs.build_packages }}
        run: npm run desktop:build -- --debug --no-bundle --ci --config tauri.ci.conf.json -- --locked
      - name: Build unsigned test package
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_packages }}
        run: npm run desktop:build -- --ci --config tauri.ci.conf.json --bundles ${{ matrix.bundle }} -- --locked
      - name: Archive macOS app with executable permissions
        if: ${{ inputs.build_packages && runner.os == 'macOS' }}
        run: |
          mkdir desktop-package
          ditto -c -k --sequesterRsrc --keepParent src/desktop/target/release/bundle/macos/MarkBend.app desktop-package/MarkBend.zip
      - name: Record package identity and hashes
        if: ${{ inputs.build_packages }}
        run: node src/web/package-artifact.mjs ${{ matrix.bundle }}
        env:
          CI_CHECKOUT_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.build_packages }}
        with:
          name: desktop-${{ matrix.os }}-${{ github.sha }}
          path: src/desktop/target/debug/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.build_packages }}
        with:
          name: unsigned-package-${{ matrix.os }}-${{ runner.arch }}-${{ github.sha }}
          path: desktop-package
          if-no-files-found: error
          retention-days: 7
