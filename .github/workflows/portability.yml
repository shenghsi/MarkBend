name: portability

on:
  push:
  pull_request:

jobs:
  bend:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Bend
        run: curl --proto '=https' --tlsv1.2 -fsSL https://bend-lang.com/install.sh | sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check complete rendering batch
        run: |
          export PATH="$HOME/.bend/bin:$PATH"
          sh tests/check.sh
