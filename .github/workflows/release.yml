name: draft-beta-release

on:
  push:
    tags:
      - 'v*-beta.*'

permissions:
  contents: read

concurrency:
  group: beta-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node src/release/release.mjs validate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CI_CHECKOUT_SHA: ${{ github.sha }}

  packages:
    needs: validate
    uses: ./.github/workflows/portability.yml
    with:
      build_packages: true

  draft:
    needs: [validate, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: unsigned-package-*-${{ github.sha }}
          path: release-input
      - run: node src/release/release.mjs create
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CI_CHECKOUT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
