<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Paragraph layout check</title>
<link rel="stylesheet" href="/src/web/style.css">
<style>body{display:block;margin:24px;font:16px system-ui}#editor{border:1px solid #888;margin:16px 0;max-width:760px;height:auto}body > button{margin:4px}#result{white-space:pre-wrap;font:12px monospace}</style></head>
<body><h1>Paragraph layout check</h1>
<p>Check text flow, list spacing, quote depth, source reveal, and exact Undo/Redo.</p>
<button id="end">End</button><button id="undo">Undo</button><button id="redo">Redo</button><button id="source">Source mode</button>
<div id="editor"></div><pre id="result" role="status"></pre>
<script type="module">
import {EditorState,Compartment} from '@codemirror/state';
import {EditorView} from '@codemirror/view';
import {ensureSyntaxTree} from '@codemirror/language';
import {history,undo,redo,undoDepth} from '@codemirror/commands';
import {documentLanguage} from '/src/web/document-language.ts';
import {livePreview} from '/src/web/preview.ts';
import {fromSource,normalize,sourceExtensions,sourceField,savedSource} from '/src/web/source.ts';
const original='\uFEFF# Plain heading\r\n\r\n# HTML <kbd>heading</kbd>\r\n\r\nPlain paragraph.\r\n\r\nHTML <b>paragraph</b>.\r\n\r\nAnother <i>HTML</i> paragraph.\r\n\r\nUse <b>first\r\nsecond</b>. Hard break  \r\nthird.\r\n\r\n- <b>Tight one</b>.\r\n- <i>Tight two</i>.\r\n\r\n1. <b>Loose one</b>.\r\n\r\n2. <i>Loose two</i>.\r\n\r\n- Outer\r\n  - Inner <kbd>Enter</kbd>.\r\n\r\n> Quote <b>first\r\n> second</b>.\r\n> > Nested <i>quote</i>.\r\n\r\n<div>Isolated frame.</div>\r\n\rEnd\n';
const record=fromSource(original),doc=normalize(record.raw),mode=new Compartment();let sourceMode=false;
let state=EditorState.create({doc,selection:{anchor:doc.length},extensions:[sourceExtensions(record),history(),documentLanguage(),EditorView.lineWrapping,mode.of(livePreview),EditorView.updateListener.of(()=>queueMicrotask(report))]});
if(!ensureSyntaxTree(state,state.doc.length,1000))throw new Error('Incomplete syntax tree');state=state.update({}).state;
const view=new EditorView({parent:document.querySelector('#editor'),state});
function report(){const exact=savedSource(view.state.field(sourceField));document.querySelector('#result').textContent=JSON.stringify({exactOriginal:exact===original,history:undoDepth(view.state),sourceMode,selection:view.state.selection.main.head,source:exact},null,2)}
document.querySelector('#end').onclick=()=>{view.dispatch({selection:{anchor:view.state.doc.length},scrollIntoView:true});view.focus();report()};
document.querySelector('#undo').onclick=()=>{undo(view);report()};document.querySelector('#redo').onclick=()=>{redo(view);report()};
document.querySelector('#source').onclick=()=>{sourceMode=!sourceMode;view.dispatch({effects:mode.reconfigure(sourceMode?[]:livePreview)});document.querySelector('#editor').classList.toggle('source-mode',sourceMode);report()};
new MutationObserver(report).observe(view.dom,{childList:true,subtree:true,attributes:true});report();
window.addEventListener('pagehide',()=>view.destroy(),{once:true});
</script></body></html>
