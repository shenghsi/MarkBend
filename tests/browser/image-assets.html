<!doctype html>
<meta charset="utf-8">
<title>Image copy controls check</title>
<style>body{font:16px system-ui;margin:24px;background:#fff;color:#222}.link-controls{display:flex;flex-wrap:wrap;gap:12px;padding:16px;background:#eef2f5}.link-controls[hidden]{display:none}label{display:flex;align-items:center;gap:6px}input{font:inherit}#editor{border:1px solid #888;margin:16px 0;padding:12px}pre{white-space:pre-wrap}</style>
<h1>Image copy controls check</h1>
<p>This form uses a test file picker and copy result. Native file effects have separate host checks.</p>
<div id="bar"><button id="image">Image</button><button id="undo">Undo</button></div>
<div id="editor"></div><p id="status" role="status"></p><pre id="result"></pre>
<script type="module">
import {EditorState} from '@codemirror/state';
import {EditorView} from '@codemirror/view';
import {history,undo,undoDepth} from '@codemirror/commands';
import {markdown} from '@codemirror/lang-markdown';
import {linkControls} from '/src/web/link-controls.ts';
import {linkVersion} from '/src/web/links.ts';
import {imageBasePath,imagePath,imageDocument} from '/src/web/images.ts';
import {fromSource,sourceExtensions,sourceField,savedSource} from '/src/web/source.ts';
let copies=0;
const view=new EditorView({parent:document.querySelector('#editor'),state:EditorState.create({doc:'Photo 图😀',selection:{anchor:0,head:9},extensions:[markdown(),history(),linkVersion,sourceExtensions(fromSource('Photo 图😀')),imageBasePath.of('/tmp/doc #%.md'),imagePath,imageDocument.of(7),EditorView.updateListener.of(report)]})});
function report(){if(!view)return;document.querySelector('#result').textContent=JSON.stringify({source:savedSource(view.state.field(sourceField)),history:undoDepth(view.state),copies},null,2);}
const open=linkControls(view,document.querySelector('#bar'),message=>{document.querySelector('#status').textContent=message;report()},'image',async()=>'/tmp/photo.png',{available:()=>true,copy:async()=>{copies++;return 'doc #%.assets/image.png'}});
document.querySelector('#image').onclick=open;document.querySelector('#undo').onclick=()=>{undo(view);report()};
window.addEventListener('pagehide',()=>view.destroy(),{once:true});report();
</script>
