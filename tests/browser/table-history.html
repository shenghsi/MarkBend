<!doctype html>
<meta charset="utf-8">
<title>Table history check</title>
<style>body {font:16px system-ui; margin:24px; color:#222; background:white} td,th {padding:16px;border:1px solid #999;min-width:140px} table {border-collapse:collapse} #editor {border:1px solid #999;margin:16px 0} pre {white-space:pre-wrap}</style>
<h1>Table history check</h1>
<button id="prepare">Prepare two cell edits</button>
<button id="undo">Undo</button>
<button id="redo">Redo</button>
<input aria-label="Other input" placeholder="Other input">
<div id="editor"></div><pre id="result"></pre>
<script type="module">
import {EditorState, Transaction} from '@codemirror/state';
import {EditorView} from '@codemirror/view';
import {history, undo, redo, isolateHistory} from '@codemirror/commands';
import {documentLanguage} from '/src/web/document-language.ts';
import {livePreview} from '/src/web/preview.ts';
import {tableEditor, tableCellField} from '/src/web/table.ts';
import {fromSource, normalize, sourceExtensions, sourceField, savedSource} from '/src/web/source.ts';
const original = '\uFEFF| A | B |\r\n| - | - |\r| 图😀 one | two |\n\nEnd';
const doc = normalize(fromSource(original).raw);
const view = new EditorView({parent:document.querySelector('#editor'), state:EditorState.create({doc, selection:{anchor:doc.length}, extensions:[sourceExtensions(fromSource(original)),documentLanguage(),history(),livePreview,EditorView.updateListener.of(()=>queueMicrotask(report))]})});
const controller = () => tableEditor(document.querySelector('.preview-table'));
function report() { const active=view.state.field(tableCellField,false), child=controller()?.child;
document.querySelector('#result').textContent=JSON.stringify({exactOriginal:savedSource(view.state.field(sourceField))===original,source:savedSource(view.state.field(sourceField)),column:active?.column,cell:child?.state.doc.toString(),anchor:child?.state.selection.main.anchor,head:child?.state.selection.main.head,focused:child?.hasFocus}); }
document.querySelector('#prepare').onclick=()=>{let table=controller();table.begin(1,0);table.child.dispatch({selection:{anchor:3,head:0}});table.child.dispatch({changes:{from:0,to:3,insert:'FIRST'},annotations:[Transaction.userEvent.of('input'),isolateHistory.of('full')]});table=controller();table.begin(1,1);table.child.dispatch({changes:{from:0,to:3,insert:'SECOND'},annotations:[Transaction.userEvent.of('input'),isolateHistory.of('full')]});report();};
document.querySelector('#undo').onclick=()=>undo(view);
document.querySelector('#redo').onclick=()=>redo(view);
window.addEventListener('pagehide',()=>view.destroy(),{once:true});report();
</script>
