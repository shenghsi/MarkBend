<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Body inline HTML check</title>
<link rel="stylesheet" href="/src/web/style.css">
<style>body{display:block;margin:24px;background:white;color:#222;font:16px system-ui}#editor{border:1px solid #888;padding:16px;margin:16px 0}button{margin:4px}pre{white-space:pre-wrap}.preview-image img{width:32px;height:32px}</style></head>
<body><h1>Body inline HTML check</h1>
<p>Check natural text layout, math, local images, source reveal, and Undo/Redo. Image reads use a test host.</p>
<button id="undo">Undo</button><button id="redo">Redo</button><button id="source">Source mode</button><button id="pixels">Check image pixels</button>
<div id="editor"></div><pre id="result" role="status"></pre>
<script type="module">
import {EditorState,Compartment} from '@codemirror/state';
import {EditorView} from '@codemirror/view';
import {ensureSyntaxTree} from '@codemirror/language';
import {history,undo,redo,undoDepth} from '@codemirror/commands';
import {mockIPC,clearMocks} from '@tauri-apps/api/mocks';
import {documentLanguage} from '/src/web/document-language.ts';
import {livePreview} from '/src/web/preview.ts';
import {imageBasePath,imagePath,imageDocument} from '/src/web/images.ts';
import {fromSource,normalize,sourceExtensions,sourceField,savedSource} from '/src/web/source.ts';
const image=new TextEncoder().encode('<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><rect width="32" height="32" fill="#208050"/></svg>');
const reads=[];let sourceMode=false,pixel;
window.isTauri=true;
mockIPC((command,args)=>{
  if(command!=='read_image'||args.destination!=='image.svg'||args.documentPath!=='/tmp/body.md'||args.document!==42)throw new Error('Unexpected image read');
  reads.push({...args});return image.buffer;
});
const original='\uFEFF# Press <kbd>Enter</kbd>\r\n\r\nUse **<span lang="ja">日本語😀 $\\frac{1}{2}$ ![Green square][asset]</span>** and H<sub>2</sub>O.\r\n\r\n> > Text with <mark>highlight\r\n> > and **continued** 日本語😀 note[^日本語]</mark>.\r\n> >\r\n> > Uncovered quote.\r\n\r\n- Outer\r\n  - Use <b>first\r\n    **continued** $y^2$</b>.\r\n\r\nStyled <span style="color:#b03020">red text</span> remains isolated.\r\n\r\n[asset]: image.svg\r\n\r\n[^日本語]: Note\r\n\r\nEnd\n';
const record=fromSource(original),doc=normalize(record.raw),mode=new Compartment();
let state=EditorState.create({doc,selection:{anchor:doc.length},extensions:[sourceExtensions(record),history(),documentLanguage(),imagePath,imageBasePath.of('/tmp/body.md'),imageDocument.of(42),mode.of(livePreview),EditorView.updateListener.of(()=>queueMicrotask(report))]});
if(!ensureSyntaxTree(state,state.doc.length,1000))throw new Error('Incomplete syntax tree');state=state.update({}).state;
const view=new EditorView({parent:document.querySelector('#editor'),state});
function report(){
  const exact=savedSource(view.state.field(sourceField));
  document.querySelector('#result').textContent=JSON.stringify({exactOriginal:exact===original,history:undoDepth(view.state),sourceMode,
    formulas:view.dom.querySelectorAll('mjx-container').length,image:!!view.dom.querySelector('.preview-inline-html img'),
    semanticBlocks:view.dom.querySelectorAll('.preview-inline-html[data-ready=true]').length,
    isolatedBlocks:view.dom.querySelectorAll('.preview-inline-html[data-ready=isolated]').length,reads:reads.length,pixel,source:exact},null,2);
}
document.querySelector('#undo').onclick=()=>{undo(view);report()};
document.querySelector('#redo').onclick=()=>{redo(view);report()};
document.querySelector('#source').onclick=()=>{sourceMode=!sourceMode;view.dispatch({effects:mode.reconfigure(sourceMode?[]:livePreview)});report()};
document.querySelector('#pixels').onclick=()=>{
  const img=view.dom.querySelector('.preview-inline-html img');if(img?.complete&&img.naturalWidth===32&&img.naturalHeight===32){
    const canvas=document.createElement('canvas');canvas.width=32;canvas.height=32;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0);pixel=Array.from(ctx.getImageData(16,16,1,1).data);
  }report();
};
new MutationObserver(report).observe(view.dom,{childList:true,subtree:true,attributes:true});view.dom.addEventListener('load',report,true);report();
window.addEventListener('pagehide',()=>{view.destroy();clearMocks();delete window.isTauri},{once:true});
</script></body></html>
