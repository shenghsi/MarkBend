<!doctype html>
<meta charset="utf-8">
<title>Dropped image asset copy check</title>
<link rel="stylesheet" href="/src/web/style.css">
<style>body{display:block;margin:24px;background:white;color:#222;font:16px system-ui}#editor{border:1px solid #888;margin:16px 0;padding:12px}#bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}pre{white-space:pre-wrap}</style>
<h1>Dropped image asset copy check</h1>
<p>This check uses browser coordinates and a test host. It does not use a native OS drop.</p>
<div id="bar"><button id="body">Drop in document text</button><button id="inactive">Drop in rendered cell</button><button id="open">Edit cell</button><button id="active">Drop in cell text</button><button id="finish">Finish cell edit</button><button id="undo">Undo</button><button id="redo">Redo</button></div>
<div id="editor"></div><p id="status" role="status"></p><pre id="result"></pre>
<script type="module">
import {EditorState} from '@codemirror/state';
import {EditorView} from '@codemirror/view';
import {history,undo,redo,undoDepth} from '@codemirror/commands';
import {mockIPC,clearMocks} from '@tauri-apps/api/mocks';
import {documentLanguage} from '/src/web/document-language.ts';
import {livePreview} from '/src/web/preview.ts';
import {imageBasePath,imagePath,imageDocument} from '/src/web/images.ts';
import {droppedImageControls} from '/src/web/clipboard-assets.ts';
import {imageDrops} from '/src/web/image-drop.ts';
import {tableEditor} from '/src/web/table.ts';
import {linkVersion} from '/src/web/links.ts';
import {fromSource,normalize,sourceExtensions,sourceField,savedSource} from '/src/web/source.ts';
const canvas=document.createElement('canvas');canvas.width=32;canvas.height=32;
canvas.getContext('2d').fillStyle='#176dc5';canvas.getContext('2d').fillRect(0,0,32,32);
const bytes=Uint8Array.from(atob(canvas.toDataURL('image/png').split(',')[1]),c=>c.charCodeAt(0));
const assets=new Map();let copies=0,copyExact=false;window.isTauri=true;
mockIPC((command,args)=>{
  if(command==='copy_image'){copies++;copyExact=args instanceof Uint8Array&&args.length===bytes.length&&args.every((v,i)=>v===bytes[i]);const path=`doc #%.assets/image-${copies}.png`;assets.set(path,args);return path;}
  if(command==='read_image'){const found=assets.get(decodeURIComponent(args.destination));if(found)return found.buffer;throw new Error('Missing image');}
  throw new Error(command);
});
const controls=droppedImageControls(document.querySelector('#bar'),{native:true,available:()=>null,storage:{getItem:()=>null,setItem:()=>{}}});
const original='\uFEFF# Dropped images\r\n\r\nDrop here: 图😀\r\n\r\n| Image |\r\n| - |\r\n| Cell 图😀 |\r\n\rEnd';
const record=fromSource(original),doc=normalize(record.raw),at=doc.indexOf('图😀');
const view=new EditorView({parent:document.querySelector('#editor'),state:EditorState.create({doc,selection:{anchor:doc.length},extensions:[
  sourceExtensions(record),history(),documentLanguage(),linkVersion,imageBasePath.of('/notes/doc #%.md'),imagePath,imageDocument.of(7),livePreview,
  EditorView.updateListener.of(()=>queueMicrotask(report))]})});
const drops=imageDrops(view,{scale:async()=>devicePixelRatio,blocked:()=>null,read:async()=>bytes.buffer,policy:controls.capture,
  report:message=>{document.querySelector('#status').textContent=message;report()}});
const table=()=>tableEditor(view.dom.querySelector('.preview-table'));
async function drop(x,y){await drops.drop('/images/original.png',{x:x*devicePixelRatio,y:y*devicePixelRatio});report()}
function report(){document.querySelector('#result').textContent=JSON.stringify({exactOriginal:savedSource(view.state.field(sourceField))===original,
  source:savedSource(view.state.field(sourceField)),history:undoDepth(view.state),copies,copyExact,
  images:Array.from(view.dom.querySelectorAll('.preview-image img,.table-image img'),i=>({width:i.naturalWidth,height:i.naturalHeight}))},null,2)}
document.querySelector('#body').onclick=()=>{const r=view.coordsAtPos(at);if(r)void drop(r.left,(r.top+r.bottom)/2)};
document.querySelector('#inactive').onclick=()=>{const r=view.dom.querySelector('td')?.getBoundingClientRect();if(r)void drop(r.left+12,r.top+12)};
document.querySelector('#open').onclick=()=>{table()?.begin(1,0);table()?.child?.dispatch({selection:{anchor:0,head:4}})};
document.querySelector('#active').onclick=()=>{const r=table()?.child?.coordsAtPos(4);if(r)void drop(r.left,(r.top+r.bottom)/2)};
document.querySelector('#finish').onclick=()=>{table()?.finish();report()};
document.querySelector('#undo').onclick=()=>{undo(view);report()};document.querySelector('#redo').onclick=()=>{redo(view);report()};
new MutationObserver(report).observe(view.dom,{childList:true,subtree:true,attributes:true});view.dom.addEventListener('load',report,true);report();
window.addEventListener('pagehide',()=>{drops.dispose();view.destroy();clearMocks();delete window.isTauri},{once:true});
</script>
