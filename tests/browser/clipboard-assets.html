<!doctype html>
<meta charset="utf-8">
<title>Clipboard asset copy check</title>
<link rel="stylesheet" href="/src/web/style.css">
<style>body{display:block;margin:24px;background:white;color:#222;font:16px system-ui}#editor{border:1px solid #888;margin:16px 0;padding:12px}#bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}pre{white-space:pre-wrap}.preview-image img,.table-image img{max-width:120px}</style>
<h1>Clipboard asset copy check</h1>
<p>Paste a clipboard image into text or a table cell. This check uses a test host. Undo must retain the copied file and restore the exact source.</p>
<div id="bar"><button id="undo">Undo</button><button id="redo">Redo</button><button id="cell">Edit table cell</button><button id="body">Edit document text</button></div>
<div id="editor"></div><p id="status" role="status"></p><pre id="result"></pre><pre id="clipboard-bytes" hidden></pre>
<script type="module">
import {EditorState} from '@codemirror/state';
import {EditorView} from '@codemirror/view';
import {history,undo,redo,undoDepth} from '@codemirror/commands';
import {mockIPC,clearMocks} from '@tauri-apps/api/mocks';
import {documentLanguage} from '/src/web/document-language.ts';
import {livePreview} from '/src/web/preview.ts';
import {imageBasePath,imagePath,imageDocument} from '/src/web/images.ts';
import {clipboardImageControls} from '/src/web/clipboard-assets.ts';
import {imagePaste} from '/src/web/image-paste.ts';
import {tableEditor} from '/src/web/table.ts';
import {linkVersion} from '/src/web/links.ts';
import {fromSource,normalize,sourceExtensions,sourceField,savedSource} from '/src/web/source.ts';
const canvas=document.createElement('canvas');canvas.width=32;canvas.height=32;
canvas.getContext('2d').fillStyle='#d84332';canvas.getContext('2d').fillRect(0,0,32,32);
const base64=canvas.toDataURL('image/png').split(',')[1];document.querySelector('#clipboard-bytes').textContent=base64;
const expected=Uint8Array.from(atob(base64),c=>c.charCodeAt(0)), assets=new Map();let copies=0,copyExact=false;
window.isTauri=true;
mockIPC((command,args)=>{
  if(command==='copy_image'){copies++;copyExact=args instanceof Uint8Array&&args.length===expected.length&&args.every((v,i)=>v===expected[i]);
    const path=`doc #%.assets/image-${copies}.png`;assets.set(path,args);return path;}
  if(command==='read_image'){const bytes=assets.get(decodeURIComponent(args.destination));if(bytes)return bytes.buffer;throw new Error('Missing image');}
  throw new Error(command);
});
const controls=clipboardImageControls(document.querySelector('#bar'),{native:true,available:()=>null,storage:{getItem:()=>null,setItem:()=>{}}});
const original='\uFEFF# Clipboard images\r\n\r\nPaste here: 图😀\r\n\r\n| Image |\r\n| - |\r\n| Cell 图😀 |\r\n\rEnd';
const record=fromSource(original),doc=normalize(record.raw);
const view=new EditorView({parent:document.querySelector('#editor'),state:EditorState.create({doc,selection:{anchor:doc.indexOf('图😀')},extensions:[
  sourceExtensions(record),history(),documentLanguage(),linkVersion,imageBasePath.of('/notes/doc #%.md'),imagePath,imageDocument.of(7),livePreview,
  imagePaste(message=>{document.querySelector('#status').textContent=message;report()},()=>null,controls.capture),
  EditorView.updateListener.of(()=>queueMicrotask(report))]})});
function report(){document.querySelector('#result').textContent=JSON.stringify({exactOriginal:savedSource(view.state.field(sourceField))===original,
  source:savedSource(view.state.field(sourceField)),history:undoDepth(view.state),copies,copyExact,
  images:Array.from(view.dom.querySelectorAll('.preview-image img,.table-image img'),i=>({width:i.naturalWidth,height:i.naturalHeight}))},null,2)}
document.querySelector('#undo').onclick=()=>{undo(view);report()};document.querySelector('#redo').onclick=()=>{redo(view);report()};
document.querySelector('#cell').onclick=()=>{const table=tableEditor(view.dom.querySelector('.preview-table'));table?.begin(1,0);table?.child?.focus()};
document.querySelector('#body').onclick=()=>{const table=tableEditor(view.dom.querySelector('.preview-table'));table?.finish();view.dispatch({selection:{anchor:view.state.doc.toString().indexOf('图😀')}});view.focus()};
new MutationObserver(report).observe(view.dom,{childList:true,subtree:true,attributes:true});view.dom.addEventListener('load',report,true);report();
window.addEventListener('pagehide',()=>{view.destroy();clearMocks();delete window.isTauri},{once:true});
</script>
